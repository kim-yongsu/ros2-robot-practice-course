name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
      - "examples/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "requirements-dev.txt"
      - ".github/workflows/pages.yml"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r docs/requirements.txt -c docs/constraints.txt -r requirements-dev.txt
      - name: Sync and validate course sources
        run: |
          python scripts/sync_assets.py
          python scripts/course_contract_check.py --json-report course-contract.json
          python scripts/content_lint.py
          python scripts/check_relative_links.py
          python scripts/check_translation_parity.py
          python scripts/check_snippet_sync.py
          python scripts/sphinx_source_preflight.py
          python -m pytest -q
      - name: Build Sphinx HTML
        run: sphinx-build -W --keep-going -b html docs/source docs/_build/html
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
